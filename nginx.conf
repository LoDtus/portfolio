server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression - Tối ưu điểm Google Lighthouse
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Xử lý Routing của Next.js Static Export (Clean URLs)
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # Cache triệt để Static Assets (Images, Fonts, CSS, JS)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|webp|avif)$ {
        expires 6m;
        add_header Cache-Control "public, max-age=15552000, immutable";
        access_log off;
    }

    # Custom Error Pages (nếu có)
    error_page 404 /404.html;
}