# CI/CD: kiểm tra (lint, kiểu, build, quét gói) trên mọi push và pull request; chỉ push vào main mới deploy lên Cloudflare
# (Workers Static Assets, cấu hình trong wrangler.jsonc, tên miền portfolio.longvi.org).
# Cần hai GitHub secret (Settings > Secrets and variables > Actions): CLOUDFLARE_API_TOKEN (mẫu "Edit Cloudflare Workers")
# và CLOUDFLARE_ACCOUNT_ID. Chi tiết trong README mục "Triển khai".
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Build và deploy lại mỗi tháng (ngày 1, 03:00 UTC) dù không có commit: trang tĩnh chứa nội dung tính lúc build
  # (số năm "hơn/gần N năm" của trường, liên kết ngành học còn hay mất, năm ở chân trang) nên cần làm mới định kỳ.
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: read

# Cùng một nhánh/PR thì hủy lượt cũ khi có lượt mới.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  # Biến lúc build: được đóng vào HTML (canonical, sitemap, og:url). Không kèm cổng, không có dấu "/" cuối.
  NEXT_PUBLIC_APP_URL: https://portfolio.longvi.org
  # Measurement ID của Google Analytics 4 (công khai trong HTML, không phải bí mật). Tải ngay khi người xem vào trang.
  NEXT_PUBLIC_GA_ID: G-NV754NB5GV
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next build tạo next-env.d.ts và kiểu của route nên phải chạy trước type-check; nó cũng tự kiểm tra kiểu.
      - name: Build static site
        run: npm run build

      - name: Type-check
        run: npm run type-check

      # Chỉ chặn lỗ hổng mức cao trở lên trong gói chạy thật (không tính gói dev).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check build output
        run: |
          test -f out/vi.html
          test -f out/en.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/_headers

      # Chặn deploy nếu bản build có link tới domain lạ (cờ bạc, mã độc), script ngoài hay iframe (xem script).
      - name: Check for injected links and scripts
        run: npm run check:output

      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare
    needs: verify
    # Chỉ khi push (hoặc chạy tay) trên main; PR không bao giờ deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://portfolio.longvi.org
    # Mỗi lượt deploy chạy lần lượt, không hủy giữa chừng.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Cần wrangler.jsonc trong repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deploy đúng bản đã build và kiểm tra ở job trên, không build lại.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out

      # Chưa thêm secret thì bỏ qua deploy kèm cảnh báo, để pipeline không đỏ trong lúc thiết lập.
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID chưa được thêm vào GitHub secrets, bỏ qua bước deploy."
          fi

      - name: Deploy
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.165.0"
          command: deploy
